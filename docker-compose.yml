services:
  api:
   build: .
   ports:
    - "5000:5000"
   environment:
     DATABASE_URL: ${DATABASE_URL}
   depends_on :
     - db  

  db:
    image: postgres:17
    container_name: postgres_db
    environment:
      POSTGRES_USER: gurmeet
      POSTGRES_PASSWORD: root123
      POSTGRES_DB: tasks
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: